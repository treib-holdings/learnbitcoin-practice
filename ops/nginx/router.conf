# HTTP router for the practice network.
#
#   :80    ACME HTTP-01 challenges only (the Let's Encrypt certificate for
#          practice-electrum); everything else 404. Published.
#   :8081  Internal origin for the Cloudflare tunnel, behind Cloudflare Access
#          (service token) so only the practice Worker reaches it. Not published.
#          /esplora/* -> electrs:3000 (Esplora REST); /bots/* -> bots (phase A1)
#
# Certificates come by HTTP-01 on purpose: no Cloudflare API token ever lives
# on this server, since one could edit learnbitcoin.com's DNS.

worker_processes 1;
events { worker_connections 1024; }

http {
  server_tokens off;
  access_log off;
  # Docker's DNS, so upstreams resolve when requested rather than at start.
  resolver 127.0.0.11 valid=30s ipv6=off;

  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 404; }
  }

  server {
    listen 8081;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location /esplora/ {
      limit_except GET POST { deny all; }
      set $esplora http://electrs:3000;
      rewrite ^/esplora/(.*)$ /$1 break;
      proxy_pass $esplora;
    }
    location / { return 404; }
  }

  # :8082  The public explorer (practice-explorer), through the tunnel, never
  #        indexed: a block explorer is millions of crawlable pages. The stock
  #        mempool frontend calls the network "Bitcoin", so every page gets a
  #        practice-network banner and an honest title.
  server {
    listen 8082;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location / {
      set $explorer http://mempool-web:8080;
      proxy_pass $explorer;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;   # mempool's live updates use a websocket
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";      # plain HTML, so the banner can go in
      sub_filter_types text/html;
      sub_filter_once on;
      sub_filter '<title>mempool - Bitcoin Explorer</title>' '<title>Practice network explorer (no real value)</title>';
      sub_filter '</head>' '<style>#lb-practice-banner{position:sticky;top:0;z-index:100000;padding:6px 12px;background:#f7931a;color:#111;font:600 14px/1.4 system-ui,-apple-system,sans-serif;text-align:center}</style></head>';
      sub_filter '<body>' '<body><div id="lb-practice-banner">LearnBitcoin practice network: play money with no value. These are not real bitcoin.</div>';
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
