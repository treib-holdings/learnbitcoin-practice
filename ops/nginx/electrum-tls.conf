# Electrum over TLS: the one public service, for Sparrow and Electrum desktop.
#   :50002 (TLS) -> electrs:50001 (plain Electrum protocol on the compose network)
# Starts only once the certificate exists (see ops/README.md, first run).

worker_processes 1;
events { worker_connections 1024; }

stream {
  resolver 127.0.0.11 valid=30s ipv6=off;
  server {
    listen 50002 ssl;
    ssl_certificate     /etc/letsencrypt/live/practice-electrum.learnbitcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/practice-electrum.learnbitcoin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $electrum electrs:50001;
    proxy_pass $electrum;
    proxy_timeout 10m;
  }
}
