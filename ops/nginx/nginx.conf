# Router for the practice network. DRAFT for spike S1.
#
#   :80     ACME HTTP-01 challenges only (Let's Encrypt for practice-electrum)
#   :50002  Electrum over TLS -> electrs:50001 (the one public service)
#   :8081   internal origin for the Cloudflare tunnel (Access-protected):
#           /esplora/* -> electrs:3000, /bots/* -> bots:8080 (phase A1)
#
# The certificate is issued by HTTP-01 on purpose: no Cloudflare API token
# ever lives on this server, since one could edit learnbitcoin.com's DNS.

worker_processes 1;
events { worker_connections 1024; }

stream {
  upstream electrum { server electrs:50001; }
  server {
    listen 50002 ssl;
    ssl_certificate     /etc/letsencrypt/live/practice-electrum.learnbitcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/practice-electrum.learnbitcoin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_pass electrum;
    proxy_timeout 10m;
  }
}

http {
  server_tokens off;
  access_log off;

  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 404; }
  }

  server {
    listen 8081;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location /esplora/ {
      limit_except GET POST { deny all; }
      proxy_pass http://electrs:3000/;
    }
    location / { return 404; }
  }
}
