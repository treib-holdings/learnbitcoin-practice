# LearnBitcoin practice network: a private regtest chain.
#
# Readers never talk to this node directly. Their wallets use electrs's
# Esplora API through the practice Worker; Sparrow uses electrs's Electrum
# port. RPC credentials come from the compose .env (-rpcuser/-rpcpassword).

regtest=1

[regtest]
server=1
txindex=1

# Nobody can peer with this node. Regtest blocks are not signed, so an
# outside node could mine a longer chain and reorganize ours.
listen=0
dnsseed=0
fixedseeds=0

# Mainnet standardness rules (regtest accepts non-standard transactions by
# default, which would make dust and policy lessons wrong).
acceptnonstdtxn=0

# RPC and ZMQ only on the compose network.
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12
rpcport=18443
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333

# Bot wallets need a fee rate before the chain has fee history.
fallbackfee=0.00002

# Smaller blocks, so a handful of transactions can already form a queue for
# the fee lessons. Spike S1 checks that generatetoaddress honours it; if not,
# the block producer picks transactions itself and calls generateblock.
blockmaxweight=400000

maxmempool=100
dbcache=100
